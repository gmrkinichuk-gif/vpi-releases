name: content

# Only public documents and the ledger of published releases may live here (tools/check_repo.py).
# Every published or edited release is checked against that ledger.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published, edited, prereleased]

permissions:
  contents: read

jobs:
  files:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests of the content check
        run: python -m unittest discover -s tests -v
      - name: Allowed files, secrets, licence identity, append-only ledger
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python tools/check_repo.py --base "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            python tools/check_repo.py --base "$BEFORE"
          else
            python tools/check_repo.py
          fi

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release files match the ledger
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python tools/check_repo.py --release-dir "$RUNNER_TEMP/assets" --tag "$TAG" --body-file "$RUNNER_TEMP/body.md"
